<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/styles/main.css"><title>暗像｜圖片隱寫術</title></head><body><header><p class="eyebrow">DARKROOM STEGANOGRAPHY</p><h1>暗<span>像</span></h1><p>你的秘密，只留在瀏覽器裡。</p></header><main><nav class="tabs" aria-label="工具模式"><button class="active" data-tab="hide-text">藏入文字</button><button data-tab="read-text">取出文字</button><button data-tab="hide-file">藏入檔案</button><button data-tab="read-file">取出檔案</button></nav>
<section id="hide-text" class="panel active"><h2>將文字沖印進像素</h2><label>載體圖片<input id="ht-image" type="file" accept="image/*"></label><div id="capacity" class="meter">請先選擇圖片</div><label>秘密文字<textarea id="ht-text" rows="7" placeholder="只在本機處理"></textarea></label><label>密碼（選填）<span class="password"><input id="ht-pass" type="password" autocomplete="new-password"><button class="eye" type="button" aria-label="顯示密碼">◉</button></span></label><button id="ht-run" class="primary" disabled>輸出 PNG</button><p id="ht-status" class="status" role="status"></p><a id="ht-download" class="download" hidden>下載暗像 PNG</a></section>
<section id="read-text" class="panel"><h2>從像素顯影文字</h2><label>暗像 PNG<input id="rt-image" type="file" accept="image/png,image/*"></label><label>密碼（若有）<span class="password"><input id="rt-pass" type="password" autocomplete="current-password"><button class="eye" type="button" aria-label="顯示密碼">◉</button></span></label><button id="rt-run" class="primary">取出文字</button><p id="rt-status" class="status" role="status"></p><pre id="rt-result" hidden></pre></section>
<section id="hide-file" class="panel"><h2>將檔案封存在圖片尾端</h2><label>原始圖片（不重新編碼）<input id="hf-image" type="file" accept="image/png,image/jpeg"></label><label>要藏入的任意檔案<input id="hf-file" type="file"></label><label>密碼（選填）<span class="password"><input id="hf-pass" type="password" autocomplete="new-password"><button class="eye" type="button" aria-label="顯示密碼">◉</button></span></label><button id="hf-run" class="primary">產生附加檔案</button><p id="hf-status" class="status" role="status"></p><a id="hf-download" class="download" hidden>下載合成圖片</a></section>
<section id="read-file" class="panel"><h2>從圖片尾端取回檔案</h2><label>含附加資料的圖片<input id="rf-image" type="file" accept="image/png,image/jpeg"></label><label>密碼（若有）<span class="password"><input id="rf-pass" type="password" autocomplete="current-password"><button class="eye" type="button" aria-label="顯示密碼">◉</button></span></label><button id="rf-run" class="primary">取出檔案</button><p id="rf-status" class="status" role="status"></p><a id="rf-download" class="download" hidden>下載取出的檔案</a></section></main><footer>全程離線運算 · 不上傳檔案 · 加密功能需 HTTPS 或 localhost</footer><script type="module" src="/main.js"></script></body></html>
